version: "3.8"

services:
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: analytics-service:latest
    container_name: "analytics-service"
    ports:
      - "4002:4002"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    external: true