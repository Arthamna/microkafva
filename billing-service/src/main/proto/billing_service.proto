syntax = "proto3";

// put request and response on separated file
// easier to check 
option java_multiple_files = true;
option java_package = "billing";

// Billing service is to ..
service BillingService {
// Create Billing Account is to ...
  rpc CreateBillingAccount(BillingRequest) returns (BillingResponse);


}

message BillingRequest {
  string patientId = 1;
  string name = 2;
  string email = 3;
}

message BillingResponse {
  string accountId = 1;
  string status = 2;
}

