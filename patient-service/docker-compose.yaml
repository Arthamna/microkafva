version: "3.8"

services:
  patient-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: patient-service:0.0.1-SNAPSHOT
    container_name: "patient-service"
    ports:
      - "4000:4000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-service-db:5432/patient-service-db
      SPRING_DATASOURCE_USERNAME: '${POSTGRE_USER}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRE_PASS}'
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      BILLING_SERVICE_ADDRESS: '${BILLING_SERVICE_ADDRESS}'
      BILLING_SERVICE_GRPC_PORT: '${BILLING_SERVICE_GRPC_PORT}'
    depends_on:
      patient-service-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  patient-service-db:
    image: postgres:16
    container_name: "patient-service-db"
    environment:
      POSTGRES_DB: patient-service-db
      POSTGRES_USER: '${POSTGRE_USER}'
      POSTGRES_PASSWORD: '${POSTGRE_PASS}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRE_USER} -d patient-service-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    external: true