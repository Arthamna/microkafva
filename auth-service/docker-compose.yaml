version: "3.8"

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: auth-service:latest
    container_name: "auth-service"
    ports:
      - "4005:4005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-service-db:5432/auth-service-db
      SPRING_DATASOURCE_USERNAME: '${POSTGRE_USER}'
      SPRING_DATASOURCE_PASSWORD: '${POSTGRE_PASS}'
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: '${JWT_SECRET}'
    depends_on:
      auth-service-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  auth-service-db:
    image: postgres:16
    container_name: "auth-service-db"
    environment:
      POSTGRES_DB: auth-service-db
      POSTGRES_USER: '${POSTGRE_USER}'
      POSTGRES_PASSWORD: '${POSTGRE_PASS}'
    volumes:
      - auth-service_postgres_data:/var/lib/postgresql/data
    ports:
      - "5001:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRE_USER} -d auth-service-db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - internal

volumes:
  auth-service_postgres_data:

networks:
  internal:
    external: true